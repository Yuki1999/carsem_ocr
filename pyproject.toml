[project]
name = "teleidp"
version = "0.1.0"
description = "TeleIDP multitenant intelligent document processing platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi",
  "httpx",
  "pillow",
  "psycopg[binary,pool]>=3.2,<4",
  "pypdfium2",
  "python-multipart",
  "requests",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]",
]

[dependency-groups]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
