services:
  postgres:
    image: postgres:16
    container_name: teleidp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: teleidp
      POSTGRES_USER: teleidp_admin
      POSTGRES_PASSWORD: teleidp_admin
    ports:
      - "55432:5432"
    volumes:
      - teleidp-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teleidp_admin -d teleidp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  teleidp-postgres-data:
